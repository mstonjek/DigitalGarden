# Local development stack only. Production (Coolify) builds the Dockerfile
# directly and provides MySQL as a managed service + env variables.
services:
  www:
    build: .
    ports:
      - "8000:80"
    volumes:
      - ./temp:/var/www/html/temp
      - ./log:/var/www/html/log
    environment:
      DEBUG_MODE: 1
      TZ: "${TZ:-Europe/Prague}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      GITHUB_REDIRECT_URI: "${GITHUB_REDIRECT_URI:-http://localhost:8000/callback}"
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: digitalgarden
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - net

  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: digitalgarden
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - net

  # Dev-only database browser: docker compose --profile debug up
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    profiles: ["debug"]
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 100M
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - mysql
    networks:
      - net

volumes:
  mysql-data:

networks:
  net:
    driver: bridge
