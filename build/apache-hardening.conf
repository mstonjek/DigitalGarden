# Defense-in-depth for CVE-2026-109618 and CVE-2026-109619.
# php_admin_value cannot be overridden by ini_set() at runtime, so the
# mitigation values survive any application-level change.
#
# PHP 8.5 runs as mod_php in this image (php:8.5.12-apache).
php_admin_value memory_limit -1
php_admin_value post_max_size 8M
php_admin_value upload_max_filesize 2M
php_admin_value session.upload_progress.enabled 0
php_admin_value fatal_error_backtraces 0

# Web-server level body limit: also covers requests without a usable
# Content-Length (chunked bodies), which php's post_max_size cannot bound.
LimitRequestBody 8388608
