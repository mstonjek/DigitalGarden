; Defense-in-depth for CVE-2026-109618 (RCE via OOM corruption) and
; CVE-2026-109619 (RCE via stale global state).
;
; The actual fix is the patched PHP version pinned in the Dockerfile
; (php:8.5.12). These settings only remove the documented preconditions:
;  - no controllable PHP memory limit failure,
;  - small request bodies (the app handles no file uploads),
;  - no session upload progress state,
;  - no fatal error backtraces.
;
; Keep in sync with build/apache-hardening.conf, which locks the same
; values through php_admin_value so application code cannot override them.
memory_limit = -1
post_max_size = 8M
upload_max_filesize = 2M
session.upload_progress.enabled = 0
fatal_error_backtraces = 0
